<title>Странники галактики</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: status strip on top, viewport on the left, ship console on the right (stacks on phones).
   Look: rounded blue-metal consoles in the spirit of classic space-trading games. Single dark look by design. */
:root{
  --bg:#03060d; --panel:#16305a; --panel2:#0a1830; --line:#4a78bc; --edge:#7aa6e6;
  --fg:#e3ecfa; --dim:#93a8c8; --amber:#ffbf55; --cyan:#6fdcff; --bad:#ff6a5f; --good:#76e8a0; --violet:#c09bff;
  --metal:linear-gradient(180deg,#30589a 0%,#1b3a6c 38%,#122a52 70%,#0e2244 100%);
  --display:'Russo One','Arial Black',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(ellipse at 30% 0%,#0d1a33 0%,var(--bg) 60%);color:var(--fg);font-family:var(--body);overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.metal{background:var(--metal);border:1px solid var(--line);border-radius:12px;box-shadow:inset 0 1px 0 rgba(180,215,255,.45),inset 0 -3px 8px rgba(0,0,0,.45),0 3px 12px rgba(0,0,0,.6)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 14px}
header h1{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em;margin:0;color:var(--amber);text-transform:uppercase;text-shadow:0 1px 0 #000,0 0 10px rgba(255,180,70,.35)}
.stat{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.stat b{color:var(--fg);font-weight:600}
.bar{width:70px;height:7px;background:#06101f;border:1px solid #2c4d80;border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 2px #000}
.bar i{display:block;height:100%;background:linear-gradient(#9feaff,var(--cyan))}
#interestBar i{background:linear-gradient(#e0c8ff,var(--violet))}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:8px;min-height:0}
#view{position:relative;border:2px solid #3d68a8;border-radius:14px;overflow:hidden;background:#000;min-height:0;touch-action:none;box-shadow:0 0 0 1px #0b1a33,inset 0 0 30px rgba(0,0,0,.8)}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hudc{pointer-events:none}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,50,30,.6));opacity:0;transition:opacity .35s}
#reticle{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;opacity:.9}
#reticle::before,#reticle::after{content:"";position:absolute;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
#reticle::before{left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;clip-path:polygon(0 0,38% 0,38% 100%,62% 100%,62% 0,100% 0,100% 100%,0 100%)}
#reticle::after{top:0;bottom:0;left:50%;width:1.5px;margin-left:-.75px;clip-path:polygon(0 0,100% 0,100% 38%,0 38%,0 62%,100% 62%,100% 100%,0 100%)}
#sceneHud{position:absolute;left:12px;right:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:var(--mono);font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
#sceneHud .btn,#sceneHud .chip{pointer-events:auto}
.chip{background:rgba(8,20,40,.75);border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--fg)}
#sceneTitle{position:absolute;left:12px;top:10px;font-family:var(--display);font-size:14px;letter-spacing:.05em;color:var(--fg);text-shadow:0 1px 3px #000;pointer-events:none}
#help{position:absolute;right:12px;top:10px;max-width:280px;text-align:right;font-size:11.5px;color:#b9c8e0;text-shadow:0 1px 2px #000,0 0 6px #000;pointer-events:none;line-height:1.4}
#touch{position:absolute;right:12px;bottom:52px;display:none;gap:6px;flex-direction:column;align-items:flex-end}
@media (pointer:coarse){#touch{display:flex}}
#touch .row{display:flex;gap:6px}
#touch button{width:56px;height:46px;font-size:14px}
aside{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;gap:4px;padding:6px 6px 0}
.tabs button{flex:1;background:linear-gradient(#24477e,#142c55);border:1px solid #3a64a4;border-bottom:0;border-radius:9px 9px 0 0;color:var(--dim);padding:8px 4px;font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tabs button.on{color:var(--amber);background:linear-gradient(#3a68b0,#1d3c70);box-shadow:inset 0 1px 0 rgba(190,220,255,.5)}
#panel{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;margin:0 6px 6px;background:rgba(4,12,26,.72);border:1px solid #2d528c;border-radius:0 0 10px 10px;box-shadow:inset 0 2px 10px rgba(0,0,0,.6)}
#panel h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;letter-spacing:.03em;text-wrap:balance}
#panel h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:4px 0 0;font-weight:600}
.muted{color:var(--dim);font-size:12.5px;line-height:1.45}
.card{border:1px solid #2f5694;background:linear-gradient(180deg,rgba(40,80,140,.35),rgba(12,28,56,.55));border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 1px 0 rgba(170,210,255,.18)}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font:600 10.5px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.btn{background:linear-gradient(#3f6db6,#1e3d72);color:#eef5ff;border:1px solid #79a5e8;border-radius:8px;padding:6px 11px;font:600 12px var(--body);cursor:pointer;text-shadow:0 1px 1px rgba(0,0,0,.6);box-shadow:inset 0 1px 0 rgba(210,230,255,.45),0 1px 3px rgba(0,0,0,.5)}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.btn.primary{background:linear-gradient(#ffd479,#e48c22);color:#2a1500;border-color:#ffe2a0;text-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.log{font-family:var(--mono);font-size:11.5px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.log div{border-left:2px solid #2f5694;padding-left:8px}
.log .clue{border-color:var(--violet)}
.log .warn{border-color:var(--bad)}
.log .good{border-color:var(--good)}
.log time{color:var(--dim);margin-right:6px}
.meter{height:5px;background:#06101f;border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%}
#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,5,12,.66);z-index:5;padding:16px}
#modal .box{max-width:430px;width:100%;padding:16px;display:flex;flex-direction:column;gap:10px;border-color:var(--amber)}
#modal h2{font-family:var(--display);font-weight:400;margin:0;font-size:20px;color:var(--amber)}
#modal p{margin:0;line-height:1.5;font-size:13.5px}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);letter-spacing:.08em;color:var(--dim);background:#02040a;z-index:4}
@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  main{grid-template-columns:minmax(0,1fr)}
  #view{height:60vh;min-height:330px}
  #help{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="metal">
    <h1>Странники галактики</h1>
    <span class="stat">Время <b id="hTime">—</b></span>
    <span class="stat">ПОТОМ <b id="hMoney">0</b></span>
    <span class="stat">Корпус <span class="bar"><i id="hHull"></i></span></span>
    <span class="stat">Детали портала <b id="hParts">0/3</b></span>
    <span class="stat">Интерес Вейров <span class="bar" id="interestBar"><i id="hInterest"></i></span></span>
  </header>
  <main>
    <div id="view">
      <canvas id="mapc"></canvas>
      <div id="three"></div>
      <canvas id="hudc"></canvas>
      <div id="flash"></div>
      <div id="reticle" hidden></div>
      <div id="sceneTitle"></div>
      <div id="help"></div>
      <div id="sceneHud"></div>
      <div id="touch">
        <div class="row"><button class="btn" id="tJet" hidden>Ранец</button><button class="btn" id="tFire">Огонь</button></div>
        <div class="row"><button class="btn" id="tUp">▲</button></div>
        <div class="row"><button class="btn" id="tDown">▼</button></div>
      </div>
      <div id="loading" hidden>Загрузка…</div>
      <div id="modal" hidden><div class="box metal" id="modalBox"></div></div>
    </div>
    <aside class="metal">
      <div class="tabs">
        <button data-tab="sys" class="on">Система</button>
        <button data-tab="crew">Экипаж</button>
        <button data-tab="log">Журнал</button>
      </div>
      <div id="panel"></div>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32((Date.now()%1000003)|0);
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const HAS3D=typeof THREE!=='undefined';
const COARSE=matchMedia('(pointer:coarse)').matches;

/* ---------- Шум ---------- */
function hash2(x,z,s){let h=(Math.imul(x,374761393)+Math.imul(z,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967295}
function vnoise(x,z,s){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=hash2(xi,zi,s),b=hash2(xi+1,zi,s),c=hash2(xi,zi+1,s),d=hash2(xi+1,zi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,z,s,o){o=o||4;let t=0,a=1,f=1,n=0;for(let i=0;i<o;i++){t+=a*vnoise(x*f,z*f,s+i*17);n+=a;a*=.5;f*=2.03}return t/n}
function h3(x,y,z,s){let h=Math.imul(x,0x27d4eb2d)^Math.imul(y,0x165667b1)^Math.imul(z,0x9e3779b1)^Math.imul(s,0x85ebca6b);h=Math.imul(h^(h>>>15),0x2c1b3c6d);h=Math.imul(h^(h>>>12),0x297a2d39);h^=h>>>15;return (h>>>0)/4294967296}
function vn3(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const a=h3(xi,yi,zi,s),b=h3(xi+1,yi,zi,s),c=h3(xi,yi+1,zi,s),d=h3(xi+1,yi+1,zi,s),e=h3(xi,yi,zi+1,s),f=h3(xi+1,yi,zi+1,s),g=h3(xi,yi+1,zi+1,s),k=h3(xi+1,yi+1,zi+1,s);
  const x1=a+(b-a)*u,x2=c+(d-c)*u,x3=e+(f-e)*u,x4=g+(k-g)*u,y1=x1+(x2-x1)*v,y2=x3+(x4-x3)*v;return y1+(y2-y1)*w}
function fbm3(x,y,z,s,o){let t=0,a=.5,n=0;for(let i=0;i<o;i++){t+=a*vn3(x,y,z,s+i*31);n+=a;a*=.5;x*=2.03;y*=2.03;z*=2.03}return t/n}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function grad(stops,t){for(let i=1;i<stops.length;i++){if(t<=stops[i][0]){const a=stops[i-1],b=stops[i],k=(t-a[0])/Math.max(1e-6,b[0]-a[0]);return [a[1][0]+(b[1][0]-a[1][0])*k,a[1][1]+(b[1][1]-a[1][1])*k,a[1][2]+(b[1][2]-a[1][2])*k]}}return stops[stops.length-1][1].slice()}
const lin=h=>hexRgb(h).map(v=>Math.pow(v/255,2.2));

/* ---------- Мир ---------- */
const RACES={
  humans:{name:'Люди',color:'#6fb7ff',neb:['#2a5aa8','#6a3aa0'],ship:['#d8dde6','#2f5fb0','#7fd8ff']},
  arkos:{name:'Империя Аркос',color:'#ff6b6b',neb:['#a0262a','#d0702a'],ship:['#e2e2e2','#b02a2a','#ff7060']},
  ether:{name:'Орден Эфира',color:'#c38bff',neb:['#6a2aa8','#2a8ac8'],ship:['#ece4f4','#8a4ad0','#d08aff']},
  kharr:{name:'Рой Кхарр',color:'#9bd35a',neb:['#5a8a2a','#a8702a'],ship:['#5a6a2a','#9bd35a','#c8ff60']},
  nokt:{name:'Нокты',color:'#9aa0b8',neb:['#2a2a48','#6a4a8a'],ship:['#1c1c24','#5a5a70','#a0a8ff']},
  synth:{name:'Конклав синтетов',color:'#5fe0d0',neb:['#127a7a','#2a4aa8'],ship:['#9aa8b0','#2ab0a0','#60ffe8']},
  corsair:{name:'Корсары Разлома',color:'#ffb347',neb:['#c85a1a','#7a2a70'],ship:['#7a5a40','#d08030','#ff8a30']}
};
const PLAYER_PAL={hull:'#dfe4ec',accent:'#2f5fb0',glow:'#7fd8ff'};
const VEYR_PAL={hull:'#26202f',accent:'#7a4cff',glow:'#c070ff',veyr:true};
const RACE_KEYS=Object.keys(RACES);
const ROLES={pilot:'Второй пилот',mech:'Механик',sci:'Учёный',fighter:'Боец',medic:'Медик',diplo:'Дипломат'};
const ROLE_ROOM={pilot:'Мостик',mech:'Мастерская',sci:'Лаборатория',fighter:'Оружейная',medic:'Лазарет',diplo:'Кают-компания'};
const TRAITS=['честный','жадный','храбрый','осторожный','весёлый','угрюмый'];
const TRAIT_CLASH=[['честный','жадный'],['храбрый','осторожный'],['весёлый','угрюмый']];
const RACE_CLASH=[['arkos','corsair'],['synth','ether'],['humans','nokt'],['arkos','ether'],['corsair','synth']];
const SHIPS={
  scout:{name:'Разведчик',cap:2,hull:100,pilot:false,price:0,speed:1,guns:1},
  corvette:{name:'Корвет',cap:5,hull:180,pilot:true,price:2500,speed:.85,guns:2}
};
const STAR_COLORS=['#ffd27a','#ffe9c4','#a8c8ff','#ff9a6a','#fff4e8'];
const BIOMES={
  desert:{name:'Пустыня',tex:[[0,'#5a321c'],[.4,'#a8622e'],[.6,'#d39a5a'],[.85,'#e9c58c'],[1,'#f5e2b8']],cloud:[255,240,220],cloudA:.3,atmo:'#ffb070',
    top:'#3f7fc8',hor:'#f2c48e',sun:'#fff1d6',low:'#8a5230',high:'#d8a467',grass:'#d08a2a',rock:'#7a5038',amp:18,water:null,flora:'pillars',creature:'#c8a070',grassH:1,grassCover:.9,danger:1},
  ice:{name:'Ледяной мир',tex:[[0,'#20406a'],[.45,'#4e7fb2'],[.55,'#bcd6ee'],[1,'#ffffff']],cloud:[255,255,255],cloudA:.6,atmo:'#9fd0ff',
    top:'#3d6fb8',hor:'#d8e8f6',sun:'#ffffff',low:'#8098b8',high:'#dce6f2',grass:'#bcd8e8',rock:'#5a6a80',amp:26,water:{level:-12,color:'#8fc2e6',ice:true},flora:'spikes',creature:'#e8eef8',grassH:.5,grassCover:.35,danger:.6},
  jungle:{name:'Джунгли',tex:[[0,'#0a2848'],[.47,'#1a5a88'],[.5,'#2d6a30'],[.7,'#3e8a34'],[.88,'#6a7a40'],[1,'#9a9a70']],cloud:[255,255,255],cloudA:.75,atmo:'#7fd0ff',
    top:'#2f7fd0',hor:'#b8e6d8',sun:'#fff8e0',low:'#2f4a22',high:'#5a7a34',grass:'#4fa82a',rock:'#4a4a44',amp:20,water:{level:-7,color:'#1d6a8a'},flora:'trees',creature:'#8a5ab0',grassH:1.3,grassCover:1,danger:1.4},
  volcano:{name:'Вулканический',tex:[[0,'#ff7a1a'],[.3,'#a0280a'],[.42,'#2a1612'],[.8,'#3e302c'],[1,'#5a4a44']],cloud:[70,60,60],cloudA:.7,atmo:'#ff6a30',
    top:'#1e0a08',hor:'#a04a22',sun:'#ffb070',low:'#2a2220',high:'#4a3a34',grass:'#5a2a14',rock:'#1e1a1a',amp:30,water:{level:-9,color:'#ff5a10',lava:true},flora:'basalt',creature:'#3a2a2a',grassH:.5,grassCover:.25,danger:1.6},
  toxic:{name:'Токсичный',tex:[[0,'#2a3a08'],[.45,'#6a8a1a'],[.6,'#a6c03a'],[.8,'#d8e070'],[1,'#f0f4b0']],cloud:[220,240,140],cloudA:.55,atmo:'#c8f060',
    top:'#5a7a1a',hor:'#d8e07a',sun:'#f8ffd0',low:'#4a5418',high:'#8a9a30',grass:'#9ac81e',rock:'#4a4a30',amp:14,water:{level:-5,color:'#7aa018'},flora:'shrooms',creature:'#d06a9a',grassH:1.1,grassCover:.8,danger:1.2}
};
const BIOME_KEYS=Object.keys(BIOMES);
const SYL=['ка','ре','то','ми','ан','ве','ло','ри','за','ну','эл','ор','си','та','гра','ксе','ди','му','ор','ин'];
function genName(n){let s='';for(let i=0;i<n;i++)s+=pick(SYL);return s[0].toUpperCase()+s.slice(1)}
const FIRST={humans:['Анна','Илья','Мира','Дан','Ева','Глеб','Нина','Олег'],arkos:['Тарвен','Кассий','Ордан','Велия'],ether:['Ил’Лаэн','Сенира','Аурис','Тиэль'],nokt:['Ноэ','Шарр','Мгла','Тень-7'],synth:['К-3Л','Модуль Ирис','Вектор','Σ-12'],corsair:['Рыжий Бо','Жила','Крюк','Сайра']};
const LAST={humans:['Ветрова','Корнев','Солнцева','Орлов','Лис','Беркут'],arkos:['из дома Аркос','Третий легион','Вар-Дален'],ether:['Хранитель','Ткущая','из Круга'],nokt:['','(в носителе)',''],synth:['','',''],corsair:['Безухий','с Разлома','Две Пушки']};

const systems=[];
let guard=0;
while(systems.length<14&&guard++<5000){
  const x=60+rnd()*880,y=50+rnd()*520;
  const name=genName(ri(2,3));
  if(systems.every(s=>Math.hypot(s.x-x,s.y-y)>115&&s.name!==name))systems.push({x,y,name});
}
const raceOrder=[...RACE_KEYS];
while(raceOrder.length<systems.length)raceOrder.push(pick(RACE_KEYS.filter(k=>k!=='kharr')));
raceOrder.sort(()=>rnd()-.5);
systems.forEach((s,i)=>{
  s.id=i;s.race=raceOrder[i];s.station=s.race!=='kharr';s.star=pick(STAR_COLORS);
  s.planets=Array.from({length:ri(1,3)},(_,k)=>({name:s.name+' '+['I','II','III'][k],biome:pick(BIOME_KEYS),seed:ri(1,1e6)}));
  s.prices={ore:ri(18,40),samples:ri(55,110)};
  s.candidates=null;s.candDay=-1;s.freeHint=s.race==='ether';
});
let JUMP=330;
systems.forEach(a=>{const d=Math.min(...systems.filter(b=>b!==a).map(b=>Math.hypot(a.x-b.x,a.y-b.y)));JUMP=Math.max(JUMP,d*1.05)});
const start=systems.find(s=>s.race==='humans');
const far=systems.filter(s=>s!==start).sort((a,b)=>Math.hypot(b.x-start.x,b.y-start.y)-Math.hypot(a.x-start.x,a.y-start.y));
const partSites=[far[0],far[Math.floor(far.length/2)],far[far.length-2]].map(s=>({sys:s.id,planet:ri(0,s.planets.length-1),known:false,got:false}));

const S={
  time:8,nextHour:9,money:700,ship:'scout',hull:100,crew:[],loc:start.id,sel:start.id,travel:null,
  cargo:{ore:0,samples:0,kits:1},interest:0,skills:{diplo:0,lead:0},xp:0,
  scene:'map',tab:'sys',log:[],won:false,unpaid:false,npc:[],sysState:null,prevSys:null
};
for(let i=0;i<9;i++){const a=pick(systems),b=pick(systems);S.npc.push({race:pick(RACE_KEYS),a,b,t:rnd()})}

/* ---------- Экипаж ---------- */
function makeCrew(race,role){
  race=race||pick(RACE_KEYS.filter(k=>k!=='kharr'));
  const nm=(pick(FIRST[race])+' '+pick(LAST[race])).trim();
  return {id:Math.random().toString(36).slice(2,8),name:nm,race,role:role||pick(Object.keys(ROLES)),trait:pick(TRAITS),
    salary:ri(25,55),morale:70,spy:rnd()<.25};
}
function crewHas(role){return S.crew.some(c=>c.role===role)}
function clashCount(c){
  let n=0;
  for(const o of S.crew){if(o===c)continue;
    if(RACE_CLASH.some(([a,b])=>(a===c.race&&b===o.race)||(b===c.race&&a===o.race)))n++;
    if(TRAIT_CLASH.some(([a,b])=>(a===c.trait&&b===o.trait)||(b===c.trait&&a===o.trait)))n++;}
  return n;
}
function moraleTarget(c){
  const per=15*(1-.17*S.skills.diplo)-(crewHas('diplo')?4:0);
  return clamp(62+6*S.skills.lead-Math.max(0,per)*clashCount(c)-(S.unpaid?20:0),0,100);
}

/* ---------- Журнал ---------- */
function fmtTime(h){const d=Math.floor(h/24)+1,hh=Math.floor(h%24);return 'День '+d+', '+String(hh).padStart(2,'0')+':00'}
function log(text,cls){S.log.unshift({t:S.time,text,cls:cls||''});if(S.log.length>80)S.log.pop();if(S.tab==='log')renderPanel()}

/* ---------- Почасовая жизнь галактики ---------- */
function hourTick(){
  systems.forEach(s=>{s.prices.ore=clamp(s.prices.ore+ri(-2,2),12,55);s.prices.samples=clamp(s.prices.samples+ri(-4,4),40,150)});
  if(Math.floor(S.time)%24===0&&S.crew.length){
    const sum=S.crew.reduce((a,c)=>a+c.salary,0);
    if(S.money>=sum){S.money-=sum;S.unpaid=false;log('Выплачено жалованье экипажу: '+sum+' ПОТОМ.')}
    else{S.unpaid=true;log('Нечем платить экипажу. Мораль падает.','warn')}
  }
  for(const c of [...S.crew]){
    const tg=moraleTarget(c);c.morale+=Math.sign(tg-c.morale)*Math.min(1.5,Math.abs(tg-c.morale));
    if(c.morale<12){S.crew=S.crew.filter(x=>x!==c);log(c.name+' ('+ROLES[c.role]+') не выдержал(а) и покинул(а) корабль.','warn');continue}
    if(!c.spy&&c.morale<30&&rnd()<.01)c.spy=true;
  }
  if(crewHas('mech')&&S.scene!=='combat')S.hull=Math.min(SHIPS[S.ship].hull,S.hull+2);
  const spies=S.crew.filter(c=>c.spy);
  S.interest+=spies.length*1.4+(partSites.some(p=>p.got)?.15:0);
  for(const sp of spies)if(rnd()<.05)clue(sp,true);
  if(S.crew.length>1&&rnd()<.018)clue(pick(S.crew),false);
  if(S.travel&&!S.travel.paused&&S.scene==='map'&&!modalOpen()){
    if(S.interest>=100){S.interest=55;encounter('veyr')}
    else if(rnd()<(systems[S.travel.to].race==='corsair'?.09:.04))encounter('pirates');
  }else if(S.interest>=100&&(S.scene==='map'||S.scene==='system')&&!modalOpen()){S.interest=55;encounter('veyr')}
  S.interest=clamp(S.interest,0,100);
  renderHud();if(S.tab!=='log')renderPanel();
}
function clue(c,real){
  // ложная улика берёт приметы случайного члена экипажа, а не шпиона
  const kind=pick(['room','race','trait']);
  let t;
  if(kind==='room')t='Ночью кто-то выходил на дальнюю связь из отсека «'+ROLE_ROOM[c.role]+'».';
  else if(kind==='race')t='Перехвачен обрывок передачи. Говорил кто-то с выговором расы «'+RACES[c.race].name+'».';
  else t='Экипаж шепчется: кто-то с характером «'+c.trait+'» слишком часто расспрашивает про портал.';
  log('Улика. '+t,'clue');
}

/* ---------- Путешествия ---------- */
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function travelHours(a,b){return dist(a,b)/(42*SHIPS[S.ship].speed)}
function canDepart(){
  if(SHIPS[S.ship].pilot&&!crewHas('pilot'))return 'Корвету нужен второй пилот. Наймите его на станции.';
  return '';
}
function startTravel(to){
  const why=canDepart();if(why){log(why,'warn');return}
  const a=systems[S.loc],b=systems[to];
  S.travel={from:S.loc,to,elapsed:0,dur:travelHours(a,b),paused:false};
  log('Гиперпрыжок к системе '+b.name+'. В пути около '+Math.ceil(S.travel.dur)+' ч.');
  if(S.scene==='system')enterGalaxy();else{renderMapHud();renderPanel()}
}
function arrive(){
  const b=systems[S.travel.to];S.prevSys=S.travel.from;S.loc=b.id;S.sel=b.id;S.travel=null;S.sysState=null;
  log('Прибыли в систему '+b.name+' ('+RACES[b.race].name+').');
  if(b.race==='kharr'&&rnd()<.25)log('Рой Кхарр заметил нас, но пока не атакует.','warn');
  if(S.scene==='map'&&HAS3D)enterSystem(b.id,true);else{renderMapHud();renderPanel()}
}
function shipPos(){
  if(!S.travel)return systems[S.loc];
  const a=systems[S.travel.from],b=systems[S.travel.to],k=S.travel.elapsed/S.travel.dur;
  return {x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k};
}

/* ---------- Модальные окна ---------- */
function modalOpen(){return !$('#modal').hidden}
function showModal(title,text,buttons){
  const box=$('#modalBox');box.innerHTML='<h2></h2><p></p><div class="btns"></div>';
  box.querySelector('h2').textContent=title;box.querySelector('p').textContent=text;
  const bw=box.querySelector('.btns');
  buttons.forEach(b=>{const el=document.createElement('button');el.className='btn'+(b.primary?' primary':'');el.textContent=b.label;
    el.onclick=()=>{$('#modal').hidden=true;b.fn&&b.fn()};bw.appendChild(el)});
  $('#modal').hidden=false;bw.querySelector('button')?.focus();
}
function encounter(kind){
  if(S.travel)S.travel.paused=true;
  if(kind==='veyr'){
    showModal('Вейры нашли вас','Шпионы передали Вейрам ваш курс. Из подпространства выходят их охотники. Договориться с Вейрами нельзя.',
      [{label:'К бою',primary:true,fn:()=>startCombat('veyr')}]);
    return;
  }
  const chance=Math.round(clamp(.2+.12*S.skills.diplo+(crewHas('diplo')?.25:0),0,.9)*100);
  showModal('Перехват','Корсары Разлома требуют сбросить груз и ПОТОМ. Их '+(systems[S.loc].race==='corsair'?3:2)+' корабля.',
    [{label:'К бою',primary:true,fn:()=>startCombat('pirates')},
     {label:'Договориться ('+chance+'%)',fn:()=>{
        if(rnd()*100<chance){const fee=Math.min(S.money,ri(40,120));S.money-=fee;log('Дипломатия: откупились за '+fee+' ПОТОМ без боя.','good');S.xp+=8;resumeTravel()}
        else{log('Переговоры сорвались.','warn');startCombat('pirates')}}}]);
}
function resumeTravel(){if(S.travel)S.travel.paused=false;renderHud();renderPanel()}

/* ---------- Карта галактики (2D) ---------- */
const mapc=$('#mapc'),mctx=mapc.getContext('2d'),hudc=$('#hudc'),hctx=hudc.getContext('2d');
const bgStars=Array.from({length:320},()=>({x:rnd()*1000,y:rnd()*620,r:rnd()*1.3+.2,a:rnd()*.6+.2}));
let view={s:1,ox:0,oy:0,w:0,h:0,dpr:1};
let mapNeb=null;
function mapNebula(){
  if(mapNeb)return mapNeb;
  const w=500,h=310,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const x=cv.getContext('2d'),img=x.createImageData(w,h),d=img.data;
  const vio=[120,50,170],ora=[235,120,40],blu=[40,90,190];
  for(let py=0;py<h;py++)for(let px=0;px<w;px++){
    const u=px/w*10,v=py/h*6.2;
    const n=fbm(u*.42,v*.42,77,6),m=fbm(u*.9+3,v*.9,91,4),q=fbm(u*.6+9,v*.6,13,4);
    let k=clamp((n-.38)*2.3,0,1);k=k*k;
    const fil=Math.pow(1-Math.abs(fbm(u*1.4,v*1.4,5,4)*2-1),6)*k*.9;
    let r=vio[0]+(ora[0]-vio[0])*m,g=vio[1]+(ora[1]-vio[1])*m,b=vio[2]+(ora[2]-vio[2])*m;
    r=r*(1-q*.6)+blu[0]*q*.6;g=g*(1-q*.6)+blu[1]*q*.6;b=b*(1-q*.6)+blu[2]*q*.6;
    const i=(py*w+px)*4,a=k*.85+fil;
    d[i]=clamp(r*a+6,0,255);d[i+1]=clamp(g*a+8,0,255);d[i+2]=clamp(b*a+16,0,255);d[i+3]=255;
  }
  x.putImageData(img,0,0);mapNeb=cv;return cv;
}
function sizeCanvases(){
  const r=$('#view').getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  for(const c of [mapc,hudc]){c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr)}
  view.w=r.width;view.h=r.height;view.s=Math.min(r.width/1000,r.height/620);view.ox=(r.width-1000*view.s)/2;view.oy=(r.height-620*view.s)/2;view.dpr=dpr;
  if(renderer){renderer.setSize(r.width,r.height,false);if(composer)composer.setSize(r.width,r.height);if(camera){camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix()}}
}
function W(x,y){return [view.ox+x*view.s,view.oy+y*view.s]}
function drawMap(t){
  const c=mctx;c.setTransform(view.dpr,0,0,view.dpr,0,0);
  c.fillStyle='#02040a';c.fillRect(0,0,view.w,view.h);
  {const k=Math.max(view.w/1000,view.h/620);c.drawImage(mapNebula(),(view.w-1000*k)/2,(view.h-620*k)/2,1000*k,620*k)}
  for(const s of bgStars){const [x,y]=W(s.x,s.y);c.globalAlpha=s.a*(.75+.25*Math.sin(t*.001+s.x));c.fillStyle='#dfe6ff';c.fillRect(x,y,s.r,s.r)}
  c.globalAlpha=1;
  const here=shipPos(),cur=systems[S.loc];
  if(!S.travel){const [x,y]=W(cur.x,cur.y);c.strokeStyle='rgba(111,220,255,.28)';c.setLineDash([4,6]);c.beginPath();c.arc(x,y,JUMP*view.s,0,7);c.stroke();c.setLineDash([])}
  for(const n of S.npc){const x0=n.a.x+(n.b.x-n.a.x)*n.t,y0=n.a.y+(n.b.y-n.a.y)*n.t;const [x,y]=W(x0,y0);c.fillStyle=RACES[n.race].color;c.globalAlpha=.8;c.fillRect(x-1.5,y-1.5,3,3)}
  c.globalAlpha=1;
  if(S.travel){const [ax,ay]=W(systems[S.travel.from].x,systems[S.travel.from].y),[bx,by]=W(systems[S.travel.to].x,systems[S.travel.to].y);
    c.strokeStyle='rgba(255,191,85,.75)';c.setLineDash([6,5]);c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();c.setLineDash([])}
  c.font='600 12px "IBM Plex Sans", system-ui, sans-serif';c.textAlign='center';
  for(const s of systems){
    const [x,y]=W(s.x,s.y),r=Math.max(5,8*view.s+2);
    const g=c.createRadialGradient(x,y,0,x,y,r*3.4);g.addColorStop(0,s.star);g.addColorStop(.25,s.star+'88');g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();c.arc(x,y,r*3.4,0,7);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(x,y,r*.45,0,7);c.fill();
    c.strokeStyle=RACES[s.race].color;c.globalAlpha=.8;c.lineWidth=1.2;c.beginPath();c.arc(x,y,r+1.5,0,7);c.stroke();c.globalAlpha=1;
    if(s.id===S.sel){c.strokeStyle='#ffbf55';c.lineWidth=2;c.beginPath();c.arc(x,y,r+6,0,7);c.stroke();c.lineWidth=1}
    if(partSites.some(p=>p.sys===s.id&&p.known&&!p.got)){c.fillStyle='#ffbf55';c.beginPath();c.moveTo(x,y-r-15);c.lineTo(x+5,y-r-10);c.lineTo(x,y-r-5);c.lineTo(x-5,y-r-10);c.fill()}
    c.fillStyle='rgba(0,0,0,.6)';c.fillText(s.name,x+1,y+r+16);
    c.fillStyle=s.station?'#e3ecfa':'#93a8c8';c.fillText(s.name,x,y+r+15);
  }
  const [px,py]=W(here.x,here.y);
  c.save();c.translate(px,py);
  let ang=-Math.PI/2;if(S.travel){const b=systems[S.travel.to];ang=Math.atan2(b.y-here.y,b.x-here.x)}
  c.rotate(ang);c.shadowColor='#7fd8ff';c.shadowBlur=10;c.fillStyle='#ffffff';c.beginPath();c.moveTo(10,0);c.lineTo(-6,5.5);c.lineTo(-3,0);c.lineTo(-6,-5.5);c.closePath();c.fill();c.restore();
}
mapc.addEventListener('click',e=>{
  if(S.scene!=='map')return;
  const r=mapc.getBoundingClientRect(),x=(e.clientX-r.left-view.ox)/view.s,y=(e.clientY-r.top-view.oy)/view.s;
  let best=null,bd=40/view.s;
  for(const s of systems){const d=Math.hypot(s.x-x,s.y-y);if(d<bd){bd=d;best=s}}
  if(best){S.sel=best.id;S.tab='sys';syncTabs();renderPanel()}
});

/* ---------- Панель ---------- */
function syncTabs(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;syncTabs();renderPanel()});
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function raceTag(r){return '<span class="tag" style="color:'+RACES[r].color+'">'+esc(RACES[r].name)+'</span>'}
function docked(){return S.scene==='system'&&SY&&SY.near==='st'}
function renderPanel(){
  const p=$('#panel');
  if(S.tab==='log'){p.innerHTML='<h2>Журнал капитана</h2><div class="log">'+S.log.map(l=>'<div class="'+l.cls+'"><time>'+fmtTime(l.t)+'</time>'+esc(l.text)+'</div>').join('')+'</div>';return}
  if(S.tab==='crew'){p.innerHTML=renderCrew();return}
  p.innerHTML=renderSystem();
}
function renderSystem(){
  const s=systems[S.sel],here=!S.travel&&S.sel===S.loc,cur=systems[S.loc];
  let h='<h2>'+esc(s.name)+'</h2><div class="rowx">'+raceTag(s.race)+'<span class="muted">'+(s.station?'Есть станция':'Станции нет')+'</span></div>';
  if(S.scene==='combat'||S.scene==='planet')return h+'<p class="muted">Вы сейчас '+(S.scene==='combat'?'в бою':'на поверхности планеты')+'. Время в галактике продолжает идти.</p>';
  if(S.travel){const b=systems[S.travel.to];h+='<p class="muted">Гиперпрыжок к '+esc(b.name)+': осталось '+Math.max(0,Math.ceil(S.travel.dur-S.travel.elapsed))+' ч.</p>'}
  else if(!here){
    const d=dist(cur,s),ok=d<=JUMP;
    h+='<div class="card"><div class="rowx"><span>Гиперпрыжок: '+Math.ceil(travelHours(cur,s))+' ч</span><button class="btn primary" data-act="go" '+(ok?'':'disabled')+'>Лететь</button></div>'+(ok?'':'<span class="muted">Слишком далеко для одного прыжка. Летите через соседние системы.</span>')+'</div>';
  }else if(S.scene==='map'){
    h+='<div class="card"><div class="rowx"><span>Вы здесь</span><button class="btn primary" data-act="sysview">Вернуться в систему</button></div></div>';
  }
  h+='<h3>Планеты</h3>';
  s.planets.forEach((pl,i)=>{
    const site=partSites.find(p=>p.sys===s.id&&p.planet===i);
    const near=here&&S.scene==='system'&&SY&&SY.near==='p'+i;
    h+='<div class="card"><div class="rowx"><b>'+esc(pl.name)+'</b><span class="muted">'+BIOMES[pl.biome].name+'</span></div>'+
      (site&&site.known&&!site.got?'<span class="muted" style="color:var(--amber)">По слухам, здесь спрятана деталь портала.</span>':'')+
      (site&&site.got?'<span class="muted">Деталь портала отсюда уже у вас.</span>':'')+
      (here?'<div class="btns">'+(near?'<button class="btn primary" data-act="land" data-i="'+i+'">Высадиться</button>':'<button class="btn" data-act="flyp" data-i="'+i+'">Лететь к планете</button>')+'</div>':'')+'</div>';
  });
  if(here&&s.station){
    if(docked())h+=renderStation(s);
    else h+='<h3>Станция</h3><div class="card"><div class="rowx"><span class="muted">Торговля, ремонт, бар и найм доступны после стыковки.</span><button class="btn" data-act="flyst">Лететь к станции</button></div></div>';
  }
  if(here&&!s.station)h+='<p class="muted">Здесь нет станции: ни торговли, ни найма.</p>';
  return h;
}
function renderStation(s){
  const sh=SHIPS[S.ship],diplo=crewHas('diplo')?1.1:1,sciMul=crewHas('sci')?1.5:1;
  const ore=Math.round(s.prices.ore*diplo),smp=Math.round(s.prices.samples*diplo*sciMul);
  let h='<h3>Станция · стыковка</h3><div class="card"><b>Рынок</b>'+
    '<div class="rowx"><span>Руда: '+S.cargo.ore+' шт × '+ore+'</span><button class="btn" data-act="sellOre" '+(S.cargo.ore?'':'disabled')+'>Продать</button></div>'+
    '<div class="rowx"><span>Образцы: '+S.cargo.samples+' шт × '+smp+'</span><button class="btn" data-act="sellSmp" '+(S.cargo.samples?'':'disabled')+'>Продать</button></div>'+
    (crewHas('sci')?'':'<span class="muted">Учёный в экипаже поднимет цену образцов в 1,5 раза.</span>')+'</div>';
  const need=sh.hull-S.hull,cost=Math.ceil(need*2);
  h+='<div class="card"><b>Док</b><div class="rowx"><span>Ремонт корпуса: '+cost+' ПОТОМ</span><button class="btn" data-act="repair" '+(need>0&&S.money>=cost?'':'disabled')+'>Починить</button></div>'+
    '<div class="rowx"><span>Ремкомплекты: '+S.cargo.kits+'</span><button class="btn" data-act="craft" '+(crewHas('mech')&&S.cargo.ore>=3?'':'disabled')+'>Собрать из 3 руды</button></div>'+
    (crewHas('mech')?'':'<span class="muted">Собирать ремкомплекты умеет только механик.</span>')+'</div>';
  const hintCost=s.freeHint?0:Math.round(200/(crewHas('diplo')?1.4:1));
  const left=partSites.filter(p=>!p.known).length;
  h+='<div class="card"><b>Бар</b><div class="rowx"><span>'+(s.freeHint?'Хранитель Ордена Эфира готов поделиться знанием даром.':'Слух о детали портала: '+hintCost+' ПОТОМ')+'</span>'+

function sphereTex(w,h,fn){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d'),img=ctx.createImageData(w,h),d=img.data;
  for(let y=0;y<h;y++){const lat=(.5-(y+.5)/h)*Math.PI,cl=Math.cos(lat),sl=Math.sin(lat);
    for(let x=0;x<w;x++){const lon=(x+.5)/w*Math.PI*2,c=fn(cl*Math.cos(lon),sl,cl*Math.sin(lon)),i=(y*w+x)*4;
      d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=c.length>3?c[3]:255}}
  ctx.putImageData(img,0,0);const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;
}
function nebulaTexture(sys){
  if(nebCache[sys.id])return nebCache[sys.id];
  const s=sys.id*131+7,A=hexRgb(RACES[sys.race].neb[0]),B=hexRgb(RACES[sys.race].neb[1]);
  const t=sphereTex(COARSE?512:768,COARSE?256:384,(x,y,z)=>{
    const n=fbm3(x*1.3+3,y*1.3,z*1.3,s,5),m=fbm3(x*2.6+9,y*2.6,z*2.6,s+3,3);
    let k=clamp((n-.42)*2.8,0,1);k*=k;
    const band=Math.exp(-y*y*7)*clamp((m-.3)*1.6,0,1)*.45;k=Math.min(1,k+band);
    const fil=Math.pow(1-Math.abs(fbm3(x*3.2,y*3.2,z*3.2,s+8,3)*2-1),8)*k*1.2;
    let r=(A[0]+(B[0]-A[0])*m)*(k*.75+fil)+3,g=(A[1]+(B[1]-A[1])*m)*(k*.75+fil)+4,b=(A[2]+(B[2]-A[2])*m)*(k*.75+fil)+9;
    return [clamp(r,0,255),clamp(g,0,255),clamp(b,0,255)];
  });
  nebCache[sys.id]=t;return t;
}
function flatNebula(sys){
  const key='flat'+sys.id;if(nebCache[key])return nebCache[key];
  const N=COARSE?384:640,s=sys.id*131+7,A=hexRgb(RACES[sys.race].neb[0]),B=hexRgb(RACES[sys.race].neb[1]);
  const cv=document.createElement('canvas');cv.width=cv.height=N;const x=cv.getContext('2d'),img=x.createImageData(N,N),d=img.data;
  for(let py=0;py<N;py++)for(let px=0;px<N;px++){
    const u=px/N*6,v=py/N*6,w=fbm(u*.5,v*.5,s+4,3)*2;
    const n=fbm(u*.55+w,v*.55,s,5),m=fbm(u*1.1+5,v*1.1-w,s+3,4);
    let k=clamp((n-.33)*2.2,0,1);k*=k;

function deformedRock(seed,detail,soft){
  const geo=new THREE.IcosahedronGeometry(1,detail==null?2:detail),p=geo.attributes.position,nr=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),n=fbm3(x*1.6+seed,y*1.6,z*1.6,seed,4),k=.7+n*.7;p.setXYZ(i,x*k,y*k*.78,z*k);nr[i*3]=x;nr[i*3+1]=y;nr[i*3+2]=z}
  if(soft)geo.setAttribute('normal',new THREE.BufferAttribute(nr,3));else geo.computeVertexNormals();return geo;
}

const _tp=HAS3D?new THREE.Vector3():null,_v=HAS3D?new THREE.Vector3():null,_v2=HAS3D?new THREE.Vector3():null;

function updateSystem(dt){
  if(!SY)return;
  for(const p of SY.planets){planetPos(p,p.body.g.position);p.body.mesh.rotation.y+=dt*.12;p.body.clouds.rotation.y+=dt*.16}
  if(SY.station){SY.station.g.rotation.y+=dt*.25;const bl=(Math.sin(performance.now()*.004)+1)/2;SY.station.lights[SY.station.lights.length-1].material.opacity=.3+.7*bl}

  if(tp){
    const dx=tp.pos.x-SY.pos.x,dz=tp.pos.z-SY.pos.z,d=Math.hypot(dx,dz);
    if(d>tp.stop+.05){const sp=30*SHIPS[S.ship].speed,step=Math.min(d-tp.stop,sp*dt);SY.pos.x+=dx/d*step;SY.pos.z+=dz/d*step;SY.moving=step>sp*dt*.3;
      let want=Math.atan2(dx,dz),diff=want-SY.head;diff=Math.atan2(Math.sin(diff),Math.cos(diff));SY.head+=diff*Math.min(1,dt*5)}

      renderSystemHud();renderPanel()}

  const sh=SY.ship;sh.g.position.copy(SY.pos);sh.g.rotation.set(0,SY.head,SY.moving?Math.sin(performance.now()*.002)*.05:0);
  for(const gl of sh.glows){const s=SY.moving?2.6+Math.random()*.6:1.2;gl.scale.set(s,s,1)}
  for(const n of SY.npcs){const d=_v.copy(n.to).sub(n.g.position);const L=d.length();if(L<2)newNpcTarget(n);else{d.multiplyScalar(1/L);n.g.position.addScaledVector(d,n.speed*dt);n.g.rotation.y=Math.atan2(d.x,d.z)}}

function leavePlanet(ok){
  if(!P)return;
  if(ok){S.cargo.ore+=P.trip.ore;S.cargo.samples+=P.trip.samples;log('Вернулись на корабль: руда '+P.trip.ore+', образцы '+P.trip.samples+'.')}

function buildPortal(){
  if(S.money<1500){log('На установку портала нужно 1500 ПОТОМ.','warn');return}
  S.money-=1500;S.won=true;const pl=P.pl;
  log('Портал собран на планете '+pl.name+'!','good');
  showModal('Портал собран','Все три детали установлены на планете '+pl.name+'. Портал гудит, за ним — Запределье. В прототипе здесь конец: вторая половина игры появится в полной версии.',
    [{label:'Играть дальше',primary:true,fn:()=>leavePlanet(true)}]);
}
function updatePlanet(dt){
  if(!P)return;
  if(keys.has('ArrowLeft'))P.yaw+=1.8*dt;if(keys.has('ArrowRight'))P.yaw-=1.8*dt;
  camera.rotation.set(P.pitch,P.yaw,0);
  const run=keys.has('ShiftLeft')||keys.has('ShiftRight');
  const ground=P.H(camera.position.x,camera.position.z),inLiquid=ground<P.level;
  let sp=(run?13:7)*(inLiquid&&!P.B.water.lava&&!P.B.water.ice?.55:1);
  const f=_v.set(-Math.sin(P.yaw),0,-Math.cos(P.yaw)),r=_v2.set(Math.cos(P.yaw),0,-Math.sin(P.yaw));
  const mv=new THREE.Vector3();
  if(keys.has('KeyW')||keys.has('ArrowUp')||touchHold.up)mv.add(f);if(keys.has('KeyS')||keys.has('ArrowDown')||touchHold.down)mv.sub(f);
  if(keys.has('KeyD'))mv.add(r);if(keys.has('KeyA'))mv.sub(r);
  const walking=mv.lengthSq()>0;
  if(walking)camera.position.addScaledVector(mv.normalize(),sp*dt);
  camera.position.x=clamp(camera.position.x,-205,205);camera.position.z=clamp(camera.position.z,-205,205);
  // реактивный ранец и гравитация
  const floor=Math.max(P.H(camera.position.x,camera.position.z),P.B.water&&P.B.water.ice?P.level:-1e9)+1.8;
  const swimFloor=inLiquid&&!P.B.water.ice?P.level+1.2:floor;
  if((keys.has('Space')||touchHold.jet)&&P.jet>0){P.vy=Math.min(P.vy+30*dt,9);P.jet=Math.max(0,P.jet-dt)}
  P.vy-=16*dt;camera.position.y+=P.vy*dt;
  const fl=Math.max(floor,swimFloor);
  if(camera.position.y<=fl){camera.position.y=fl;P.vy=0;P.jet=Math.min(1.6,P.jet+dt*.8)}
  P.bob+=walking&&camera.position.y<=fl+.01?dt*(run?11:7):0;
  camera.position.y+=Math.sin(P.bob)*.05;
  const me=camera.position;
  // солнце следует за игроком, чтобы тени были рядом
  P.sun.position.copy(me).addScaledVector(P.sunDir,160);P.sun.target.position.copy(me);
  P.windU.value+=dt;
  for(const it of [...P.items]){it.m.rotation.y+=dt*.8;if(it.m.position.distanceTo(me)<2.8){
    if(it.type==='samples'&&!crewHas('sci')&&rnd()<.5){/* без учёного половина образцов портится */}
    else P.trip[it.type]++;
    spark(it.m.position.clone().add(new THREE.Vector3(0,1,0)),it.type==='ore'?'#6fdcff':'#90ff70',2);
    scene.remove(it.m);P.items.splice(P.items.indexOf(it),1)}}
  if(P.part){P.part.t.rotation.y+=dt*1.5;P.part.t.rotation.x=Math.sin(performance.now()*.001)*.4;if(P.part.g.position.distanceTo(me)<3.4){
    P.part.site.got=true;P.part.site.known=true;boom(P.part.g.position,2,'#ffc060');scene.remove(P.part.g);P.part=null;S.xp+=50;
    S.interest+=10+S.crew.filter(c=>c.spy).length*10;
    log('Найдена деталь портала! Теперь их '+partSites.filter(p=>p.got).length+' из 3.','good');renderHud()}}
  const fighter=crewHas('fighter');
  for(const b of [...P.beasts]){
    const d=b.m.position.distanceTo(me);
    const target=d<26*P.B.danger?me:b.home;
    const dir=tmpV.set(target.x-b.m.position.x,0,target.z-b.m.position.z);
    let moving=false;
    if(dir.length()>1.6){dir.normalize();b.m.position.addScaledVector(dir,(target===me?6.5:2)*dt);b.m.rotation.y=Math.atan2(dir.x,dir.z);moving=true}
    b.m.position.y=P.H(b.m.position.x,b.m.position.z);
    b.ph+=dt*(moving?(target===me?12:6):0);
    b.legs.forEach((l,i)=>{l.rotation.x=Math.sin(b.ph+(i%3===0?0:Math.PI))*.55});
    if(d<2.6){P.hp-=(fighter?6:12)*dt}
  }
  if(fighter){P.fCd-=dt;if(P.fCd<=0){P.fCd=2.2;const t=P.beasts.filter(b=>b.m.position.distanceTo(me)<16).sort((a,b)=>a.m.position.distanceTo(me)-b.m.position.distanceTo(me))[0];
    if(t){killBeast(t,'Боец подстрелил хищника.')}}}
  P.shotT-=dt;
  if((keys.has('KeyF')||touchHold.fire||(pointer.down&&document.pointerLockElement))&&P.shotT<=0){P.shotT=.3;shoot()}
  if(P.beam){P.beam.life-=dt;P.beam.m.material.opacity=Math.max(0,P.beam.life/.1);if(P.beam.life<=0){scene.remove(P.beam.m);P.beam.m.geometry.dispose();P.beam.m.material.dispose();P.beam=null}}
  P.recoil=Math.max(0,P.recoil-dt*.6);
  P.tool.position.set(.19+Math.cos(P.bob*.5)*.006,-.15+Math.abs(Math.sin(P.bob*.5))*.008,-.36+P.recoil);
  updateFx(dt);
  if(inLiquid&&P.B.water.lava&&camera.position.y<P.level+2.2)P.hp-=30*dt;
  P.hp=Math.min(100,P.hp+(crewHas('medic')?3:.4)*dt);
  if(P.hp<=0){log('Капитан тяжело ранен. Экипаж эвакуировал его на корабль, всё собранное потеряно.','warn');S.hull=Math.max(1,S.hull);leavePlanet(false);return}
  const dShip=P.ship.position.distanceTo(me);
  $('#pHp').style.width=P.hp+'%';$('#pJet').style.width=P.jet/1.6*100+'%';
  let info='Руда '+P.trip.ore+' · образцы '+P.trip.samples+' · до корабля '+Math.round(dShip)+' м';
  if(P.part)info+=crewHas('sci')?' · деталь портала: '+Math.round(P.part.g.position.distanceTo(me))+' м':' · ищите золотой луч';
  $('#pInfo').textContent=info;
  $('#pLeave').disabled=dShip>20;
  const all=partSites.every(p=>p.got);$('#pPortal').hidden=!(all&&!S.won&&dShip<20);
  drawPlanetOverlay();
}
function killBeast(b,msg){boom(b.m.position.clone().add(new THREE.Vector3(0,1.5,0)),1.2,'#ffb070');scene.remove(b.m);P.beasts.splice(P.beasts.indexOf(b),1);if(rnd()<.6)P.trip.samples++;if(msg)log(msg)}
function shoot(){
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  let best=null,bd=50;
  for(const b of P.beasts){const c=tmpV.copy(b.m.position);c.y+=1.5;const to=c.sub(camera.position);const d=to.length();if(d<bd&&to.normalize().dot(dir)>.982){bd=d;best=b}}
  const from=new THREE.Vector3();P.tip.getWorldPosition(from);
  const end=camera.position.clone().addScaledVector(dir,best?bd:50);
  const len=from.distanceTo(end);
  const g=new THREE.CylinderGeometry(.018,.018,len,6);g.rotateX(Math.PI/2);g.translate(0,0,len/2);
  if(P.beam){scene.remove(P.beam.m);P.beam.m.geometry.dispose();P.beam.m.material.dispose()}
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:new THREE.Color(.6,2.8,4.5),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.position.copy(from);m.lookAt(end);scene.add(m);
  P.beam={m,life:.1};P.recoil=.035;
  spark(end,'#8fe8ff',1);
  if(best){best.hp--;if(best.hp<=0)killBeast(best)}
}
function drawPlanetOverlay(){
  const c=hctx;c.setTransform(view.dpr,0,0,view.dpr,0,0);c.clearRect(0,0,view.w,view.h);
  const marks=[[P.ship.position,'#ffffff','Корабль']];
  if(P.part&&crewHas('sci'))marks.push([P.part.g.position,'#ffbf55','Деталь']);
  c.font='600 11px "IBM Plex Mono", monospace';c.textAlign='center';
  for(const [p,col,label] of marks){
    const v=tmpV.copy(p).project(camera),behind=tmpV2.copy(p).applyMatrix4(camera.matrixWorldInverse).z>0;
    let x=(v.x*.5+.5)*view.w,y=(-v.y*.5+.5)*view.h;
    if(behind){x=view.w-x;y=view.h-30}
    x=clamp(x,30,view.w-30);y=clamp(y,40,view.h-60);
    c.shadowColor='#000';c.shadowBlur=4;
    c.fillStyle=col;c.beginPath();c.moveTo(x,y+6);c.lineTo(x-5,y-2);c.lineTo(x+5,y-2);c.fill();
    c.fillText(label+' '+Math.round(p.distanceTo(camera.position))+' м',x,y-8);c.shadowBlur=0;
  }
}

/* ---------- Ввод ---------- */
const viewEl=$('#view');
const touchHold={up:false,down:false,fire:false,jet:false};
window.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  keys.add(e.code);
  if((S.scene==='combat'||S.scene==='planet')&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='KeyR'&&S.scene==='combat')useKit();
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>keys.clear());
viewEl.addEventListener('pointermove',e=>{
  const r=viewEl.getBoundingClientRect();
  if(S.scene==='combat'&&e.pointerType==='mouse'){pointer.x=clamp(((e.clientX-r.left)/r.width-.5)*2.2,-1,1);pointer.y=clamp(((e.clientY-r.top)/r.height-.5)*2.2,-1,1)}
  if(S.scene==='combat'&&e.pointerType!=='mouse'&&pointer.dragging){pointer.x=clamp((e.clientX-pointer.lx)/80,-1,1);pointer.y=clamp((e.clientY-pointer.ly)/80,-1,1)}
  if(S.scene==='planet'&&P){
    if(document.pointerLockElement===viewEl){P.yaw-=e.movementX*.0025;P.pitch=clamp(P.pitch-e.movementY*.0025,-1.3,1.3)}
    else if(pointer.dragging){P.yaw-=(e.clientX-pointer.lx)*.005;P.pitch=clamp(P.pitch-(e.clientY-pointer.ly)*.005,-1.3,1.3);pointer.lx=e.clientX;pointer.ly=e.clientY}
  }
});
viewEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||modalOpen())return;
  pointer.dragging=true;pointer.lx=e.clientX;pointer.ly=e.clientY;pointer.sx=e.clientX;pointer.sy=e.clientY;
  if(S.scene==='combat'&&e.pointerType==='mouse')pointer.down=true;
  if(S.scene==='planet'&&e.pointerType==='mouse'){
    if(document.pointerLockElement===viewEl)pointer.down=true;
    else{try{const pr=viewEl.requestPointerLock&&viewEl.requestPointerLock();if(pr&&pr.catch)pr.catch(()=>{})}catch(err){}}
  }
});
viewEl.addEventListener('click',e=>{
  if(S.scene!=='system'||e.target.closest('button')||Math.hypot(e.clientX-pointer.sx,e.clientY-pointer.sy)>8)return;
  systemClick(e);
});
viewEl.addEventListener('wheel',e=>{if(S.scene==='system'&&SY){e.preventDefault();SY.zoom=clamp(SY.zoom*(e.deltaY>0?1.12:.89),.35,2.6)}},{passive:false});
window.addEventListener('pointerup',()=>{pointer.down=false;pointer.dragging=false});
function hold(id,k){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();touchHold[k]=true});for(const ev of ['pointerup','pointerleave','pointercancel'])el.addEventListener(ev,()=>touchHold[k]=false)}
hold('#tFire','fire');hold('#tUp','up');hold('#tDown','down');hold('#tJet','jet');

/* ---------- Главный цикл ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  // время в галактике идёт всегда: 1 секунда = 1 час
  S.time+=dt;
  if(S.travel&&!S.travel.paused){S.travel.elapsed+=dt;if(S.travel.elapsed>=S.travel.dur)arrive()}
  for(const n of S.npc){n.t+=dt*.04;if(n.t>=1){n.a=n.b;n.b=pick(systems);n.t=0}}
  while(S.time>=S.nextHour){S.nextHour++;hourTick()}
  try{
    if(S.scene==='map')drawMap(now);
    else if(S.scene==='system'){updateSystem(dt);render3d()}
    else if(S.scene==='combat'){updateCombat(dt);render3d()}
    else if(S.scene==='planet'){updatePlanet(dt);render3d()}
  }catch(err){console.error(err)}
  if(S.scene==='map'&&S.travel&&S.tab==='sys'&&Math.floor(now/1000)!==Math.floor((now-dt*1000)/1000))renderPanel();
  requestAnimationFrame(frame);
}
new ResizeObserver(sizeCanvases).observe(viewEl);
sizeCanvases();
log('Вы — пилот-одиночка на разведчике в системе '+start.name+'. Говорят, где-то в галактике спрятаны три детали древнего портала. Расспросите о них в барах станций.','good');
log('Подсказка: наймите экипаж на станции. Учёный показывает детали на планетах, боец защищает от хищников, механик чинит корабль, медик лечит, дипломат помогает договориться, второй пилот усиливает щиты.');
if(HAS3D){enterSystem(start.id,false)}
else{S.scene='map';setSceneUi('map');renderPanel();$('#help').textContent='Не удалось загрузить 3D-движок. Карта работает, полёты по системе, бои и высадки недоступны.'}
renderHud();
requestAnimationFrame(frame);
</script>
